name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest tests/ -v
        env:
          # Tests use their own in-memory SQLite database (see tests/test_db.py)
          # so no real Postgres credentials are needed in CI.
          DATABASE_URL: "sqlite:///:memory:"
