<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Matchday — Football Predictions</title><meta name="theme-color" content="#07111f"><link rel="manifest" href="manifest.json"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><style>
  :root{--bg:#07111f;--surface:#0e1b2d;--surface2:#13243a;--accent:#2ee59d;--accent2:#7c5cff;--text:#f5f7fb;--muted:#8fa0b5;--line:rgba(255,255,255,.09);--danger:#ff6b7a;}
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(circle at 50% -20%,#173251 0,#07111f 45%);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
  h1,.tab,.score,.view-btn{flex:1;padding:.65rem;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);font-size:.82rem;cursor:pointer;}
  header{padding:1rem 1.1rem .9rem;background:rgba(7,17,31,.92);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;backdrop-filter:blur(14px);}
  h1{font-size:1.45rem;letter-spacing:.04em;margin:0;text-transform:uppercase;}
  #config{display:none;}
  #config input{background:transparent;border:1px solid var(--line);color:var(--text);padding:.4rem .6rem;border-radius:6px;width:100%;max-width:420px;}
  .tabs{display:flex; gap:.4rem; overflow-x:auto; padding:0 1.2rem 1rem;}
  .tab{padding:.5rem .9rem;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);cursor:pointer;white-space:nowrap;font-size:.78rem;}
  .tab.active{background:var(--accent);color:#06130f;border-color:var(--accent);font-weight:700;}
  main{max-width:680px;margin:0 auto;padding:0 1rem 5rem;}
  .fixture{background:linear-gradient(145deg,rgba(19,36,58,.96),rgba(14,27,45,.96));border:1px solid var(--line);border-radius:18px;padding:1rem;margin-bottom:.85rem;box-shadow:0 8px 30px rgba(0,0,0,.18);}
  .fx-date{ font-size:.72rem; color:var(--muted); letter-spacing:.03em; margin-bottom:.6rem; }
  .teams{display:flex; align-items:center; justify-content:space-between; gap:.6rem;}
  .team{flex:1; font-weight:600; display:flex; align-items:center; gap:.5rem;}
  .team.away{justify-content:flex-end; text-align:right;}
  .crest{width:22px; height:22px; object-fit:contain; flex:0 0 auto;}
  .score{font-size:1.45rem;color:var(--accent);padding:0 .55rem;white-space:nowrap;font-weight:700;}
  .probs{display:flex;height:24px;border-radius:8px;overflow:hidden;margin-top:.9rem;background:#17283d;}
  .probs div{display:flex; align-items:center; justify-content:center; font-size:.68rem; font-weight:600; color:var(--ink); overflow:hidden; white-space:nowrap;}
  .probs .home{background:var(--accent)}.probs .draw{background:#62748b}.probs .away{background:var(--accent2);color:#fff}
  .value-bet{margin-top:.6rem;padding:.6rem .75rem;background:rgba(46,229,157,.09);border:1px solid rgba(46,229,157,.35);border-radius:10px;font-size:.8rem;}
  .hint{margin-top:.6rem;padding:.6rem .75rem;background:rgba(124,92,255,.10);border:1px solid rgba(124,92,255,.35);border-radius:10px;font-size:.8rem;}
  .hint b{color:#b9a9ff;}
  .status{padding:3rem 1rem;text-align:center;color:var(--muted);}
  .view-switch{display:flex;gap:.45rem;padding:.75rem 1rem 0;max-width:680px;margin:auto;}
  .view-btn{flex:1; padding:.55rem; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--muted); font-family:'Oswald',sans-serif; font-size:.85rem; cursor:pointer;}
  .view-btn.active{background:rgba(46,229,157,.12);border-color:var(--accent);color:var(--accent);}
  .summary-row{display:flex; gap:.6rem; flex-wrap:wrap; margin-bottom:1rem;}
  .stat{flex:1; min-width:110px; background:rgba(243,241,234,0.04); border:1px solid var(--line); border-radius:10px; padding:.7rem; text-align:center;}
  .stat .num{font-family:'Oswald',sans-serif; font-size:1.2rem; color:var(--amber);}
  .stat .lbl{font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  .tr-row{display:flex; align-items:center; justify-content:space-between; padding:.6rem 0; border-bottom:1px solid var(--line); font-size:.85rem; gap:.5rem;}
  .tr-row:last-child{border-bottom:none;}
  .tr-fixture{flex:1;}
  .tr-result{color:var(--muted); font-size:.78rem;}
  .tr-hit{color:#4FA98A;} .tr-miss{color:#D97A6C;}

@media(max-width:480px){header{padding-top:.85rem}.teams{font-size:.88rem}.team{line-height:1.15}.tabs{padding-left:1rem;padding-right:1rem}.fx-date{font-size:.68rem}}</style></head><body>
<header><div style="display:flex;align-items:center;justify-content:space-between;gap:1rem"><div><h1>Matchday</h1><p style="margin:.15rem 0 0;color:var(--muted);font-size:.72rem;letter-spacing:.04em;">DATA-DRIVEN FOOTBALL PREDICTIONS</p></div><div style="width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#07111f;font-weight:800">M</div></div></header>
<div id="config">
  API base URL: <input id="apiBase" placeholder="https://your-app.onrender.com" />
</div>
<div class="view-switch">
  <button class="view-btn active" id="viewFixtures">Fixtures</button>
  <button class="view-btn" id="viewTrackRecord">Track Record</button>
</div>
<button class="view-btn" id="notifyBtn" style="margin:.75rem 1rem 0;width:calc(100% - 2rem);">🔔 Enable alerts</button>
<div class="tabs" id="tabs"></div>
<main id="content"><div class="status">Enter your API URL above to load live predictions.</div></main>

<script>
const leagues = ["Premier League","La Liga","Serie A","Bundesliga","Ligue 1",
                  "Champions League","Eredivisie","Championship","Brazil Serie A","Liga Portugal"];
let active = leagues[0];
const tabsEl = document.getElementById('tabs');
const contentEl = document.getElementById('content');
const apiInput = document.getElementById('apiBase');

// Remembers your API URL in this browser only — not sent anywhere else.
// Defaults to the shared backend so friends don't need to know or enter
// any URL themselves — they can still override it here if they ever want to.
const DEFAULT_API_BASE = 'https://footballapp-1-9nbe.onrender.com';
apiInput.value = localStorage.getItem('matchday_api_base') || DEFAULT_API_BASE;
apiInput.addEventListener('change', () => {
  localStorage.setItem('matchday_api_base', apiInput.value.trim());
  loadLeague(active);
});

let view = 'fixtures'; // 'fixtures' | 'trackrecord'
const viewFixturesBtn = document.getElementById('viewFixtures');
const viewTrackRecordBtn = document.getElementById('viewTrackRecord');

function setView(v){
  view = v;
  viewFixturesBtn.classList.toggle('active', v === 'fixtures');
  viewTrackRecordBtn.classList.toggle('active', v === 'trackrecord');
  loadActive();
}
viewFixturesBtn.onclick = () => setView('fixtures');
viewTrackRecordBtn.onclick = () => setView('trackrecord');

function loadActive(){
  view === 'fixtures' ? loadLeague(active) : loadTrackRecord(active);
}

function renderTabs(){
  tabsEl.innerHTML = '';
  leagues.forEach(name => {
    const b = document.createElement('button');
    b.className = 'tab' + (name === active ? ' active' : '');
    b.textContent = name;
    b.onclick = () => { active = name; renderTabs(); loadActive(); };
    tabsEl.appendChild(b);
  });
}

async function loadLeague(name){
  const base = apiInput.value.trim().replace(/\/$/, '');
  if(!base){ contentEl.innerHTML = '<div class="status">Enter your API URL above to load live predictions.</div>'; return; }
  contentEl.innerHTML = '<div class="status">Loading...</div>';
  try{
    const res = await fetch(`${base}/predictions/${encodeURIComponent(name)}`);
    if(!res.ok) throw new Error(`API returned ${res.status}`);
    const data = await res.json();
    renderFixtures(data.predictions);
  }catch(err){
    contentEl.innerHTML = `<div class="status">Couldn't load predictions: ${err.message}<br>Check the API URL and that your backend is deployed and awake.</div>`;
  }
}

async function loadTrackRecord(name){
  const base = apiInput.value.trim().replace(/\/$/, '');
  if(!base){ contentEl.innerHTML = '<div class="status">Enter your API URL above to load the track record.</div>'; return; }
  contentEl.innerHTML = '<div class="status">Loading...</div>';
  try{
    const res = await fetch(`${base}/track-record/${encodeURIComponent(name)}`);
    if(!res.ok) throw new Error(`API returned ${res.status}`);
    const data = await res.json();
    renderTrackRecord(data.summary, data.history);
  }catch(err){
    contentEl.innerHTML = `<div class="status">Couldn't load track record: ${err.message}</div>`;
  }
}

function renderTrackRecord(summary, history){
  if(!summary || !summary.count){
    contentEl.innerHTML = '<div class="status">No finished fixtures recorded yet for this league. Check back once a matchday has been played.</div>';
    return;
  }
  const summaryHtml = `
    <div class="summary-row">
      <div class="stat"><div class="num">${(summary.accuracy*100).toFixed(0)}%</div><div class="lbl">Outcome accuracy</div></div>
      <div class="stat"><div class="num">${summary.avg_brier_score}</div><div class="lbl">Avg Brier (lower=better)</div></div>
      <div class="stat"><div class="num">${summary.value_bets_placed}</div><div class="lbl">Value bets flagged</div></div>
      <div class="stat"><div class="num">${summary.value_bets_profit_units > 0 ? '+' : ''}${summary.value_bets_profit_units}u</div><div class="lbl">Value bet P/L (1u/bet)</div></div>
    </div>`;
  const rowsHtml = history.map(r => {
    const actual = r.actual_home_goals > r.actual_away_goals ? 'Home' : (r.actual_away_goals > r.actual_home_goals ? 'Away' : 'Draw');
    const predicted = [['Home', r.predicted_home_win], ['Draw', r.predicted_draw], ['Away', r.predicted_away_win]]
      .sort((a,b) => b[1]-a[1])[0][0];
    const hit = predicted === actual;
    return `
    <div class="tr-row">
      <div class="tr-fixture">${r.home} ${r.actual_home_goals}-${r.actual_away_goals} ${r.away}
        <div class="tr-result">Predicted: ${predicted} (${(Math.max(r.predicted_home_win,r.predicted_draw,r.predicted_away_win)*100).toFixed(0)}%)</div>
      </div>
      <div class="${hit ? 'tr-hit' : 'tr-miss'}">${hit ? '✓' : '✕'}</div>
    </div>`;
  }).join('');
  contentEl.innerHTML = summaryHtml + '<div class="fixture">' + rowsHtml + '</div>';
}

function formatFixtureDate(iso){
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  const datePart = d.toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short' });
  const timePart = d.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
  return `${datePart} • ${timePart}`;
}

// A segment under ~7% is too narrow to hold readable text, so the number
// moves just outside it instead of getting clipped or overlapping.
function probSegment(pct, cls){
  const label = `${pct.toFixed(0)}%`;
  if(pct >= 7){
    return `<div class="${cls}" style="width:${pct}%">${label}</div>`;
  }
  return `<div class="${cls}" style="width:${pct}%" title="${label}"></div>`;
}

function crestImg(url, alt){
  if(!url) return '';
  return `<img class="crest" src="${url}" alt="${alt}" onerror="this.style.display='none'">`;
}

function renderFixtures(predictions){
  if(!predictions || predictions.length === 0){
    contentEl.innerHTML = '<div class="status">No upcoming fixtures in the next 10 days for this league.</div>';
    return;
  }
  contentEl.innerHTML = predictions.map(p => {
    const homePct = p.home_win*100, drawPct = p.draw*100, awayPct = p.away_win*100;
    // Percentages under 7% still need to be visible somewhere, so tiny ones
    // get called out separately beneath the bar rather than lost inside it.
    const tinyNotes = [
      homePct < 7 ? `${p.home} ${homePct.toFixed(0)}%` : null,
      drawPct < 7 ? `Draw ${drawPct.toFixed(0)}%` : null,
      awayPct < 7 ? `${p.away} ${awayPct.toFixed(0)}%` : null,
    ].filter(Boolean).join(' · ');
    return `
    <div class="fixture">
      <div class="fx-date">${formatFixtureDate(p.date)}</div>
      <div class="teams">
        <div class="team">${crestImg(p.home_crest, p.home)}${p.home}</div>
        <div class="score">${p.predicted_score[0]} – ${p.predicted_score[1]}</div>
        <div class="team away">${p.away}${crestImg(p.away_crest, p.away)}</div>
      </div>
      <div class="probs">
        ${probSegment(homePct, 'home')}
        ${probSegment(drawPct, 'draw')}
        ${probSegment(awayPct, 'away')}
      </div>
      ${tinyNotes ? `<div class="fx-date" style="margin-top:.4rem;margin-bottom:0;">${tinyNotes}</div>` : ''}
      ${p.hint ? `<div class="hint">💡 <b>Play ${p.hint.market}:</b> ${p.hint.selection} <span style="color:var(--muted);">(${(p.hint.confidence*100).toFixed(0)}% confidence)</span></div>` : ''}
      ${(p.value_bets||[]).map(b => `<div class="value-bet">Value bet: ${b.market} @ ${b.odds} (edge ${(b.edge*100).toFixed(1)}%)</div>`).join('')}
    </div>
  `;
  }).join('');
}

renderTabs();
if(apiInput.value) loadActive();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

// Converts the VAPID public key (base64url string) into the raw byte array
// the browser's Push API requires — this exact conversion is the standard
// boilerplate every Web Push implementation needs.
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = window.atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

const notifyBtn = document.getElementById('notifyBtn');
notifyBtn.addEventListener('click', async () => {
  const base = apiInput.value.trim().replace(/\/$/, '');
  if(!base){ alert('Enter your API URL first.'); return; }
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    alert('Push notifications are not supported in this browser.');
    return;
  }
  try{
    notifyBtn.textContent = 'Requesting permission...';
    const permission = await Notification.requestPermission();
    if(permission !== 'granted'){
      notifyBtn.textContent = '🔔 Enable value-bet notifications';
      alert('Notification permission was not granted.');
      return;
    }
    const keyRes = await fetch(`${base}/push/vapid-public-key`);
    const { publicKey } = await keyRes.json();
    if(!publicKey){
      notifyBtn.textContent = '🔔 Enable value-bet notifications';
      alert('Push is not configured on the backend yet (missing VAPID keys).');
      return;
    }
    const reg = await navigator.serviceWorker.ready;
    const subscription = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(publicKey),
    });
    await fetch(`${base}/push/subscribe`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(subscription.toJSON()),
    });
    notifyBtn.textContent = '✅ Notifications enabled';
    notifyBtn.disabled = true;
  }catch(err){
    notifyBtn.textContent = '🔔 Enable value-bet notifications';
    alert(`Couldn't enable notifications: ${err.message}`);
  }
});
</script>
</body>
</html>
